services:
  frontend:
    build:
      context: .
      dockerfile: local/Dockerfile.frontend
    ports:
      - "127.0.0.1:8082:8082"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1
    init: true
  backend:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: "5000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    init: true
